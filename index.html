<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Мой ритм</title>
<style>
:root{
  --bg:#EFE7EE;
  --bg-deep:#E4D7E4;
  --card:#FBF7F8;
  --plum:#5B3F5E;
  --plum-soft:#7B5C7E;
  --mauve:#A68CA8;
  --peach:#F3B6A1;
  --peach-deep:#E4927B;
  --ink:#3A2A3C;
  --muted:#8B788D;
  --line:rgba(91,63,94,.12);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --shadow:0 10px 30px -14px rgba(91,63,94,.35);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg-deep);min-height:100%;transition:background-color .8s}
body{min-height:100%;font-family:var(--sans);color:var(--ink);font-size:16px;line-height:1.45;
  background:radial-gradient(120% 60% at 50% 0%,#FAF4F8 0%,var(--bg) 55%,var(--bg-deep) 100%);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--peach-deep);outline-offset:2px}

#app{max-width:440px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 20px calc(env(safe-area-inset-bottom,0px) + 118px)}

/* ---------- Hero ---------- */
.hero{text-align:center;padding:8px 0 22px}
.portrait{position:relative;width:156px;height:156px;margin:0 auto 18px}
.portrait img{width:100%;height:100%;object-fit:cover;border-radius:50%;
  box-shadow:0 0 0 7px var(--bg),0 0 0 8px rgba(91,63,94,.22),0 24px 40px -18px rgba(91,63,94,.55);transition:box-shadow .8s}
.orbit i{position:absolute;border-radius:50%;display:block}
.orbit .o1{width:12px;height:12px;background:var(--peach);top:4px;right:-10px}
.orbit .o2{width:7px;height:7px;background:var(--mauve);top:52px;left:-22px}
.orbit .o3{width:5px;height:5px;background:var(--peach-deep);bottom:18px;left:-8px}
.orbit .spark{position:absolute;right:-30px;top:58px;color:var(--peach-deep);font-size:14px;font-style:normal}
.state-badge{position:absolute;right:2px;bottom:6px;width:42px;height:42px;border-radius:50%;background:var(--plum);color:#fff;display:grid;place-items:center;font-size:19px;box-shadow:0 0 0 4px var(--bg)}
.greet{font-family:var(--serif);font-size:30px;line-height:1.15;color:var(--plum);font-weight:400;letter-spacing:-.01em}
.date{margin-top:6px;color:var(--muted);font-size:15px}
.thread-line{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;color:var(--plum-soft)}
.thread-line::before{content:"";width:18px;height:1.5px;border-radius:2px;background:var(--peach-deep)}
.state-chip{margin-top:14px;display:inline-flex;align-items:center;gap:8px;padding:9px 16px 9px 12px;border-radius:999px;background:rgba(255,255,255,.6);border:1px solid var(--line);font-size:14px;color:var(--plum)}
.state-chip b{font-weight:600}

/* ---------- Sections ---------- */
.block{margin-top:26px}
.block-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;padding:0 4px}
.block-head h2{font-family:var(--serif);font-weight:400;font-size:21px;color:var(--plum)}
.block-head span{font-size:13px;color:var(--muted)}

/* Mood of the day */
.mood{margin-bottom:14px;padding:22px 22px 18px;border-radius:30px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.95);text-align:center}
.mood q{display:block;font-family:var(--serif);font-size:21px;line-height:1.35;color:var(--plum);quotes:"«" "»"}
.mood-act{margin-top:16px;display:inline-flex;align-items:center;gap:10px;padding:10px 16px 10px 10px;border-radius:999px;background:#fff;box-shadow:0 8px 18px -12px rgba(91,63,94,.5);font-size:14px;color:var(--plum)}
.mood-act .pl{width:28px;height:28px;border-radius:50%;background:var(--peach);display:grid;place-items:center;font-size:11px;color:var(--plum)}
.mood-act.done{background:transparent;box-shadow:none;color:var(--plum-soft)}
.mood-act.done .pl{background:var(--plum);color:#fff}

/* Focus capsule — the signature element */
.focus{position:relative;overflow:hidden;border-radius:34px;padding:26px 24px 24px;color:#FBF1F0;
  background:linear-gradient(155deg,#6D4C70 0%,var(--plum) 55%,#4A3250 100%);box-shadow:0 26px 44px -22px rgba(74,50,80,.8)}
.focus::after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;right:-70px;top:-80px;background:radial-gradient(circle,rgba(243,182,161,.35),transparent 70%)}
.focus-label{font-size:13px;color:#E9CFD6;display:flex;align-items:center;gap:8px}
.focus-label::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--peach)}
.focus-title{position:relative;z-index:1;font-family:var(--serif);font-size:26px;line-height:1.2;margin:12px 0 22px;max-width:92%}
.focus-row{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:1}
.focus-sphere{font-size:13px;color:#E9CFD6}
.focus-check{display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border-radius:999px;background:var(--peach);color:var(--plum);font-weight:600;font-size:15px}
.focus.done{background:linear-gradient(155deg,#7A5478 0%,#634566 55%,#51375A 100%)}
.focus.done::after{width:320px;height:320px;right:-110px;top:-140px;background:radial-gradient(circle,rgba(243,182,161,.5),transparent 70%)}
.focus.done .focus-check{background:rgba(255,255,255,.16);color:#FBF1F0}
.focus.glow{animation:glow 1.4s ease-out}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(243,182,161,.7),0 26px 44px -22px rgba(74,50,80,.8)}100%{box-shadow:0 0 0 22px rgba(243,182,161,0),0 26px 44px -22px rgba(74,50,80,.8)}}

.invite{border-radius:34px;padding:26px 24px;background:linear-gradient(155deg,#FFF7F4,#F8E4E0);border:1px solid rgba(228,146,123,.25);box-shadow:var(--shadow)}
.invite h3{font-family:var(--serif);font-weight:400;font-size:25px;line-height:1.2;color:var(--plum)}
.invite p{color:var(--muted);font-size:15px;margin:8px 0 20px}

/* Cards */
.card{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:24px;padding:16px 16px 16px 14px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.8)}
.card + .card{margin-top:10px}
.sph{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:19px}
.card .txt{flex:1;min-width:0}
.card .t{font-size:16px;line-height:1.3}
.card .s{font-size:13px;color:var(--muted);margin-top:2px}
.card.done .t{text-decoration:line-through;text-decoration-color:rgba(91,63,94,.35);color:var(--muted)}
.check{flex:none;width:32px;height:32px;border-radius:50%;border:1.5px solid rgba(91,63,94,.3);display:grid;place-items:center;transition:background .2s,border-color .2s}
.check svg{width:16px;height:16px;opacity:0;transition:opacity .2s}
.done .check,.check.on{background:var(--plum);border-color:var(--plum)}
.done .check svg,.check.on svg{opacity:1}

/* Rhythm chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:11px 16px 11px 12px;border-radius:999px;background:rgba(255,255,255,.72);border:1px solid var(--line);font-size:15px;color:var(--ink);transition:background .2s,color .2s}
.chip .ic{width:20px;text-align:center;font-size:15px}
.chip.on{background:var(--plum);color:#FBF1F0;border-color:var(--plum)}
.chip.on .ic{color:var(--peach)}
.chip[disabled]{opacity:.55;cursor:default}

/* Other tasks */
.more-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-radius:22px;background:rgba(255,255,255,.5);border:1px dashed rgba(91,63,94,.22);color:var(--plum);font-size:15px}
.more-toggle .arr{transition:transform .25s}
.more-toggle.open .arr{transform:rotate(180deg)}
.more-list{margin-top:10px}
.row{display:flex;align-items:center;gap:12px;padding:13px 6px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .txt{flex:1;min-width:0}
.row .t{font-size:15px}
.row .s{font-size:12px;color:var(--muted)}
.row.done .t{text-decoration:line-through;color:var(--muted)}
.dot{flex:none;width:9px;height:9px;border-radius:50%}
.row .check{width:28px;height:28px}
.mini-btn{flex:none;font-size:13px;color:var(--plum-soft);padding:6px 10px;border-radius:999px;background:rgba(91,63,94,.07)}

/* Progress */
.progress{display:flex;align-items:center;gap:18px;padding:18px 20px;border-radius:26px;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.9)}
.ring{flex:none;width:64px;height:64px}
.ring circle{fill:none;stroke-width:6}
.ring .bgc{stroke:rgba(91,63,94,.1)}
.ring .fg{stroke:var(--peach-deep);stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.ring text{font-family:var(--serif);font-size:17px;fill:var(--plum)}
.progress .p1{font-family:var(--serif);font-size:19px;color:var(--plum)}
.progress .p2{font-size:14px;color:var(--muted)}

/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px 20px;border-radius:999px;background:var(--peach);color:var(--plum);font-weight:600;font-size:16px;box-shadow:0 14px 26px -14px rgba(228,146,123,.9)}
.btn.plum{background:var(--plum);color:#FBF1F0;box-shadow:0 14px 26px -14px rgba(74,50,80,.8)}
.btn.ghost{background:transparent;box-shadow:none;border:1.5px solid rgba(91,63,94,.25);color:var(--plum)}
.btn[disabled]{opacity:.45}
.link{display:block;margin:14px auto 0;color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px}
.evening-note{padding:20px 22px;border-radius:26px;background:linear-gradient(155deg,#FFF7F4,#F6E3E6);border:1px solid rgba(228,146,123,.2)}
.evening-note .q{font-size:13px;color:var(--muted)}
.evening-note .a{font-family:var(--serif);font-size:19px;color:var(--plum);margin-top:6px;line-height:1.35}

/* ---------- Week ---------- */
.page-title{font-family:var(--serif);font-weight:400;font-size:32px;color:var(--plum);line-height:1.1;padding:10px 4px 0}
.page-sub{color:var(--muted);font-size:15px;padding:6px 4px 0;display:flex;align-items:center;justify-content:space-between}
.wk-nav{display:flex;gap:6px}
.wk-nav button{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.65);border:1px solid var(--line);color:var(--plum);font-size:16px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:20px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0 10px;border-radius:22px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.9);transition:background .2s}
.day .wd{font-size:12px;color:var(--muted)}
.day .n{font-family:var(--serif);font-size:20px;color:var(--plum);line-height:1}
.day .dots{display:flex;gap:3px;height:6px}
.day .dots i{width:5px;height:5px;border-radius:50%}
.day.today{border-color:var(--peach-deep)}
.day.sel{background:var(--plum)}
.day.sel .wd{color:#E9CFD6}
.day.sel .n{color:#FBF1F0}
.sel-head{display:flex;align-items:baseline;justify-content:space-between;margin:28px 4px 12px}
.sel-head h2{font-family:var(--serif);font-weight:400;font-size:22px;color:var(--plum)}
.sel-head span{font-size:13px;color:var(--muted)}
.panel{background:var(--card);border-radius:26px;padding:6px 16px;box-shadow:var(--shadow)}
.panel .chips{padding:14px 0 12px}
.empty{padding:22px 4px;text-align:center;color:var(--muted);font-size:15px}
.add-inline{display:block;width:100%;text-align:center;padding:14px;color:var(--plum-soft);font-size:15px}
.rec-row .days-lbl{font-size:12px;color:var(--muted)}

/* ---------- Rhythm ---------- */
.big{margin-top:20px;border-radius:32px;padding:24px;color:#FBF1F0;background:linear-gradient(155deg,#6D4C70 0%,var(--plum) 60%,#4A3250 100%);box-shadow:0 26px 44px -22px rgba(74,50,80,.8)}
.big .num{font-family:var(--serif);font-size:52px;line-height:1}
.big .cap{color:#E9CFD6;font-size:15px;margin-top:6px}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:84px;margin-top:22px}
.bars div{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars b{display:block;width:100%;max-width:26px;border-radius:10px;background:var(--peach);min-height:4px;opacity:.95}
.bars b.zero{background:rgba(255,255,255,.18)}
.bars span{font-size:11px;color:#E9CFD6}
.thread{display:flex;align-items:center;gap:16px;margin-top:14px;padding:18px 20px;border-radius:26px;background:linear-gradient(155deg,#FFF7F4,#F7E2DD);border:1px solid rgba(228,146,123,.25)}
.thread .knot{flex:none;width:58px;height:58px;border-radius:50%;background:#fff;display:grid;place-items:center;font-family:var(--serif);font-size:24px;color:var(--plum);box-shadow:0 0 0 5px rgba(243,182,161,.35)}
.thread .t1{font-family:var(--serif);font-size:19px;color:var(--plum)}
.thread .t2{font-size:13px;color:var(--muted);margin-top:2px}
.stat{background:var(--card);border-radius:24px;padding:18px 18px 16px;box-shadow:var(--shadow);margin-top:12px}
.stat-top{display:flex;align-items:center;justify-content:space-between}
.stat-top .l{display:flex;align-items:center;gap:10px;font-size:16px}
.stat-top .v{font-family:var(--serif);font-size:22px;color:var(--plum)}
.stat-dots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.stat-dots i{height:8px;border-radius:99px;background:rgba(91,63,94,.08)}
.stat-dots i.plan{background:transparent;box-shadow:inset 0 0 0 1.5px rgba(91,63,94,.25)}
.stat-dots i.on{background:var(--peach-deep);box-shadow:none}
.states-week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:var(--card);border-radius:24px;padding:16px 10px;box-shadow:var(--shadow)}
.states-week div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:18px;min-height:78px}
.states-week span{font-size:11px;color:var(--muted)}
.states-week em{font-style:normal;font-size:10px;color:var(--muted)}
.envelope{position:relative;overflow:hidden;padding:24px 22px;border-radius:30px;background:#FFFDFB;border:1px solid rgba(228,146,123,.28);box-shadow:var(--shadow)}
.envelope::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:repeating-linear-gradient(90deg,var(--peach) 0 18px,transparent 18px 26px,var(--mauve) 26px 44px,transparent 44px 52px);opacity:.7}
.envelope h3{font-family:var(--serif);font-weight:400;font-size:22px;color:var(--plum)}
.envelope p{font-size:14px;color:var(--muted);margin:6px 0 16px}
.envelope .link{margin:12px 0 0;display:inline-block}
.joy{background:var(--card);border-radius:26px;padding:4px 20px;box-shadow:var(--shadow)}
.joy-item{padding:16px 0;border-bottom:1px solid var(--line)}
.joy-item:last-child{border-bottom:0}
.joy-item .jt{font-family:var(--serif);font-size:17px;line-height:1.4;color:var(--ink)}
.joy-item .jd{font-size:12px;color:var(--muted);margin-top:4px}
.quiet{margin:28px 0 0;text-align:center;font-family:var(--serif);font-size:18px;color:var(--plum-soft);line-height:1.4}

/* ---------- Tab bar ---------- */
.dock{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;justify-content:center;gap:10px;z-index:20;pointer-events:none}
.dock[hidden]{display:none}
.tabs{pointer-events:auto;display:flex;gap:2px;padding:6px;border-radius:999px;background:var(--plum);box-shadow:0 18px 34px -16px rgba(74,50,80,.85)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:74px;padding:8px 12px;border-radius:999px;color:#D8BFCB;font-size:12px}
.tab svg{width:21px;height:21px}
.tab.active{background:rgba(255,255,255,.14);color:#FFF}
.fab{pointer-events:auto;width:62px;height:62px;border-radius:50%;background:var(--peach);color:var(--plum);display:grid;place-items:center;box-shadow:0 18px 30px -14px rgba(228,146,123,.95)}
.fab svg{width:26px;height:26px}

/* ---------- Sheet ---------- */
.veil{position:fixed;inset:0;background:rgba(58,42,60,.35);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.veil.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:480px;margin:0 auto;max-height:92vh;overflow:auto;
  background:#FBF6F8;border-radius:32px 32px 0 0;padding:12px 22px calc(env(safe-area-inset-bottom,0px) + 24px);
  transform:translateY(105%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s linear .32s}
.sheet.show{transform:translateY(0);visibility:visible;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s}
.grab{width:42px;height:5px;border-radius:9px;background:rgba(91,63,94,.18);margin:0 auto 18px}
.steps{display:flex;gap:6px;justify-content:center;margin-bottom:18px}
.steps i{width:22px;height:4px;border-radius:9px;background:rgba(91,63,94,.14)}
.steps i.on{background:var(--peach-deep)}
.sheet h3{font-family:var(--serif);font-weight:400;font-size:26px;line-height:1.2;color:var(--plum);text-align:center}
.sheet .hint{text-align:center;color:var(--muted);font-size:14px;margin:8px 0 20px}
.states{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
.st{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 6px;border-radius:22px;background:#fff;border:1.5px solid transparent;font-size:14px;color:var(--ink);box-shadow:0 8px 20px -14px rgba(91,63,94,.4)}
.st .e{font-size:24px}
.st.on{border-color:var(--plum);background:#F5ECF3}
.pick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border-radius:20px;background:#fff;border:1.5px solid transparent;margin-bottom:8px;box-shadow:0 8px 20px -16px rgba(91,63,94,.5)}
.pick.on{border-color:var(--plum);background:#F5ECF3}
.pick .t{flex:1;font-size:15px}
.pick .r{width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(91,63,94,.3);flex:none}
.pick.on .r{background:var(--plum);border-color:var(--plum);box-shadow:inset 0 0 0 4px #F5ECF3}
.field{width:100%;padding:15px 18px;border-radius:18px;border:1.5px solid rgba(91,63,94,.15);background:#fff;font-size:16px;margin-bottom:14px}
.field:focus{border-color:var(--plum);outline:none}
textarea.field{min-height:96px;resize:none;font-family:var(--serif);font-size:18px}
.lbl{font-size:13px;color:var(--muted);margin:4px 2px 8px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.seg button{padding:10px 14px;border-radius:999px;background:#fff;border:1.5px solid rgba(91,63,94,.12);font-size:14px}
.seg button.on{background:var(--plum);color:#fff;border-color:var(--plum)}
.seg.small button{padding:8px 12px;font-size:13px}
.wds{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.wds button{padding:11px 0;border-radius:14px;background:#fff;border:1.5px solid rgba(91,63,94,.12);font-size:13px}
.wds button.on{background:var(--plum);color:#fff;border-color:var(--plum)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:18px;background:#fff;margin-bottom:18px}
.sw{width:48px;height:28px;border-radius:99px;background:rgba(91,63,94,.18);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.sw.on{background:var(--plum)}
.sw.on::after{transform:translateX(20px)}
.move{padding:14px 0;border-bottom:1px solid var(--line)}
.move .t{font-size:15px;margin-bottom:10px}
.move .acts{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:6px}
.move .acts button,.move .acts select{width:100%;min-width:0;padding:9px 6px;border-radius:999px;background:#fff;border:1.5px solid rgba(91,63,94,.14);font-size:13px;text-align:center;text-align-last:center;-webkit-appearance:none;appearance:none;color:var(--plum)}
.move .acts [data-a="rel"]{color:var(--muted)}
.move.resolved{opacity:.55}
.move.resolved .acts{display:none}
.move .res{font-size:13px;color:var(--plum-soft)}
.move .res:empty{display:none}
.done-list .row .check{pointer-events:none}
.sheet .btn{margin-top:6px}

/* Breathing */
.breath{position:relative;width:220px;height:220px;margin:6px auto 18px;display:grid;place-items:center}
.breath .halo{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(243,182,161,.55),rgba(166,140,168,.15) 65%,transparent 72%);transform:scale(.62);transition-property:transform;transition-timing-function:ease-in-out}
.breath .core{position:relative;width:118px;height:118px;border-radius:50%;background:linear-gradient(155deg,#6D4C70,var(--plum));color:#FBF1F0;display:grid;place-items:center;text-align:center;font-family:var(--serif);font-size:19px;line-height:1.2;box-shadow:0 18px 30px -16px rgba(74,50,80,.8)}
.breath .core small{display:block;font-family:var(--sans);font-size:12px;color:#E9CFD6;margin-top:4px}
.practice-text{text-align:center;color:var(--ink);font-size:15px;margin:0 6px 18px;line-height:1.5}

/* Letter */
.letter{background:#FFFDFB;border-radius:24px;padding:26px 22px;margin:4px 0 18px;box-shadow:0 12px 30px -20px rgba(91,63,94,.5);font-family:var(--serif);color:var(--ink);font-size:17px;line-height:1.6}
.letter p + p{margin-top:12px}
.letter .hi{font-size:22px;color:var(--plum)}
.letter ul{list-style:none;margin:10px 0 0}
.letter li{padding-left:18px;position:relative;margin-top:6px;font-style:italic}
.letter li::before{content:"";position:absolute;left:2px;top:.72em;width:7px;height:7px;border-radius:50%;background:var(--peach)}
.letter ul + p{margin-top:16px}
.letter .sign{text-align:right;color:var(--plum);margin-top:18px}

/* Petals & toast & stub */
.petal{position:fixed;z-index:70;pointer-events:none;border-radius:60% 0 60% 0}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 100px);transform:translate(-50%,20px);opacity:0;z-index:60;max-width:calc(100% - 40px);text-align:center;
  background:var(--plum);color:#FBF1F0;padding:13px 20px;border-radius:22px;font-size:14px;transition:all .3s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.stub{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.stub .moon{width:84px;height:84px;border-radius:50%;background:linear-gradient(155deg,#FFF4EF,var(--peach));display:grid;place-items:center;font-size:34px;margin-bottom:22px;box-shadow:0 20px 34px -18px rgba(228,146,123,.9)}
.stub h2{font-family:var(--serif);font-weight:400;font-size:26px;color:var(--plum)}
.stub p{color:var(--muted);margin:10px 0 24px;max-width:300px}
.stub .btn{max-width:260px}
.loading{min-height:80vh;display:grid;place-items:center;color:var(--muted);font-family:var(--serif);font-size:20px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

/* ================= Storage =================
   В Telegram — облачное хранилище (данные видны на всех твоих устройствах).
   Вне Telegram — память браузера. */
var memory = {};
var store = {
  getMany: function(keys){
    return new Promise(function(resolve){
      if(!keys.length) return resolve({});
      if(useCloud){
        try { TG.CloudStorage.getItems(keys, function(err, vals){ resolve(err ? {} : (vals||{})); }); }
        catch(e){ resolve({}); }
        return;
      }
      var out = {};
      keys.forEach(function(k){
        try { out[k] = localStorage.getItem("mr_"+k) || ""; } catch(e){ out[k] = memory[k] || ""; }
      });
      resolve(out);
    });
  },
  set: function(key, val){
    if(useCloud){ try{ TG.CloudStorage.setItem(key, val, function(){}); }catch(e){} return; }
    try { localStorage.setItem("mr_"+key, val); } catch(e){ memory[key] = val; }
  }
};

/* ================= Dates ================= */
var MONTHS = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
var WD_FULL = ["понедельник","вторник","среда","четверг","пятница","суббота","воскресенье"];
var WD = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
function pad(n){ return (n<10?"0":"")+n; }
function dkey(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function fromKey(k){ var p=k.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function addDays(d,n){ var x=new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate()+n); return x; }
function isoDow(d){ return (d.getDay()+6)%7+1; }
function weekStart(d){ return addDays(d, -(isoDow(d)-1)); }
function weekKeys(offset){ var s=addDays(weekStart(new Date()), (offset||0)*7); var a=[]; for(var i=0;i<7;i++) a.push(dkey(addDays(s,i))); return a; }
function human(k){ var d=fromKey(k); return WD_FULL[isoDow(d)-1]+", "+d.getDate()+" "+MONTHS[d.getMonth()]; }
function shortDate(k){ var d=fromKey(k); return d.getDate()+" "+MONTHS[d.getMonth()]; }
function dayNumber(k){ var d=fromKey(k); return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000); }
function plural(n,a,b,c){ var m=n%10, h=n%100; if(m===1&&h!==11) return a; if(m>=2&&m<=4&&(h<12||h>14)) return b; return c; }

var TODAY = dkey(new Date());
var TOMORROW = dkey(addDays(new Date(),1));

/* ================= State ================= */
var DATA = null, TASKS = [], REC = [], DAYS = {}, JOY = [], THREAD = {n:0,last:""};
var ui = { tab:"day", moreOpen:false, weekOffset:0, sel:TODAY };

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function uid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2,5); }
function sphere(id){ for(var i=0;i<DATA.spheres.length;i++) if(DATA.spheres[i].id===id) return DATA.spheres[i]; return {id:id,name:"",icon:"•",color:"#A68CA8"}; }
function stateById(id){ for(var i=0;i<DATA.states.length;i++) if(DATA.states[i].id===id) return DATA.states[i]; return null; }
function tint(hex){ return hex + "2E"; }
function ph(key, fallback){ return (DATA.phrases && DATA.phrases[key]) || fallback; }
function pickDaily(arr, k, salt){ if(!arr || !arr.length) return null; return arr[(dayNumber(k) + (salt||0)) % arr.length]; }

function day(k){ if(!DAYS[k]) DAYS[k] = {}; if(!DAYS[k].done) DAYS[k].done = {}; return DAYS[k]; }
function dayKeyName(k){ return "d_"+k.replace(/-/g,"_"); }
function saveDay(k){ store.set(dayKeyName(k), JSON.stringify(DAYS[k]||{})); }
function saveTasks(){ store.set("tasks", JSON.stringify(TASKS)); }
function saveRec(){ store.set("rec", JSON.stringify(REC)); }
function saveJoy(){
  /* облако Telegram хранит до 4096 символов на ключ — держим запас */
  while(JSON.stringify(JOY).length > 3800 && JOY.length > 1) JOY.pop();
  store.set("joy", JSON.stringify(JOY));
}
function saveThread(){ store.set("thread", JSON.stringify(THREAD)); }
function loadDays(keys){
  var need = keys.filter(function(k){ return !(k in DAYS); });
  return store.getMany(need.map(dayKeyName)).then(function(vals){
    need.forEach(function(k){
      var raw = vals[dayKeyName(k)];
      try { DAYS[k] = raw ? JSON.parse(raw) : {}; } catch(e){ DAYS[k] = {}; }
    });
  });
}

function recFor(k){ var w=isoDow(fromKey(k)); return REC.filter(function(r){ return r.days.indexOf(w)>-1; }); }
function tasksFor(k){ return TASKS.filter(function(t){ return t.date===k; }); }
function overdue(){ return TASKS.filter(function(t){ return t.date<TODAY && !t.doneOn; }); }
function taskById(id){ for(var i=0;i<TASKS.length;i++) if(TASKS[i].id===id) return TASKS[i]; return null; }
function recDone(r,k){ return !!(DAYS[k] && DAYS[k].done && DAYS[k].done[r.id]); }

/* Нить ритма: +1 за каждый день, когда ты пришла к себе. Никогда не обнуляется. */
function markThread(){
  if(THREAD.last === TODAY) return;
  THREAD.n = (THREAD.n||0) + 1; THREAD.last = TODAY; saveThread();
  var ms = DATA.milestones || [];
  if(ms.indexOf(THREAD.n) > -1){
    setTimeout(function(){
      burst(window.innerWidth/2, window.innerHeight*0.35, 28);
      toast(ph("milestone","{n} дней в ритме").replace("{n}", THREAD.n), 3600);
      haptic("success");
    }, 700);
  }
}

/* ================= Theme by state ================= */
var DEF_BG = "#EFE7EE", DEF_DEEP = "#E4D7E4";
function applyTheme(){
  var st = stateById(DAYS[TODAY] && DAYS[TODAY].st);
  var bg = (st && st.bg) || DEF_BG, deep = (st && st.bgDeep) || DEF_DEEP;
  var root = document.documentElement.style;
  root.setProperty("--bg", bg); root.setProperty("--bg-deep", deep);
  if(TG){ try { TG.setHeaderColor(bg); TG.setBackgroundColor(bg); } catch(e){} }
}

/* ================= Celebration ================= */
var PETALS = ["#F3B6A1","#E4927B","#A68CA8","#F7D4C8","#D98FA6","#FFFFFF"];
function burst(x, y, count){
  if(REDUCED || !document.body.animate) return;
  for(var i=0;i<count;i++){
    var el = document.createElement("i");
    var size = 8 + Math.random()*9;
    el.className = "petal";
    el.style.width = size+"px"; el.style.height = size+"px";
    el.style.left = (x - size/2)+"px"; el.style.top = (y - size/2)+"px";
    el.style.background = PETALS[i % PETALS.length];
    document.body.appendChild(el);
    var ang = Math.random()*Math.PI*2, dist = 70 + Math.random()*120;
    var dx = Math.cos(ang)*dist, dy = Math.sin(ang)*dist - 40, rot = (Math.random()*540-270);
    var anim = el.animate([
      {transform:"translate(0,0) rotate(0deg) scale(.4)", opacity:0},
      {transform:"translate("+(dx*.35)+"px,"+(dy*.35)+"px) rotate("+(rot*.3)+"deg) scale(1)", opacity:1, offset:.2},
      {transform:"translate("+dx+"px,"+(dy+90)+"px) rotate("+rot+"deg) scale(.7)", opacity:0}
    ], {duration: 1100 + Math.random()*700, easing:"cubic-bezier(.2,.7,.3,1)"});
    anim.onfinish = (function(e){ return function(){ e.remove(); }; })(el);
  }
}
function centerOf(el){ if(!el) return [window.innerWidth/2, window.innerHeight/2]; var r = el.getBoundingClientRect(); return [r.left + r.width/2, r.top + r.height/2]; }

function toggleTask(t, srcEl){
  var d0 = DAYS[TODAY] || {};
  var isFocus = d0.f === t.id;
  var k = t.doneOn || (t.date<TODAY ? TODAY : t.date);
  if(t.doneOn){ delete day(t.doneOn).done[t.id]; saveDay(t.doneOn); t.doneOn = null; saveTasks(); render(); return; }
  t.doneOn = k; day(k).done[t.id] = t.sphere; saveDay(k); saveTasks();
  var pt = centerOf(srcEl);
  if(isFocus){
    haptic("success");
    render();
    var card = document.querySelector(".focus");
    if(card){ card.classList.add("glow"); pt = centerOf(card); }
    burst(pt[0], pt[1], 26);
    var list = ph("celebrate", ["Главное сделано."]);
    toast(pickDaily(list, TODAY, Math.floor(Math.random()*list.length)), 3000);
  } else {
    haptic(); render();
    burst(pt[0], pt[1], 7);
  }
}
function toggleRec(r, k, srcEl){
  var d = day(k);
  if(d.done[r.id]){ delete d.done[r.id]; saveDay(k); render(); return; }
  d.done[r.id] = r.sphere; saveDay(k); haptic();
  var pt = centerOf(srcEl);
  render();
  var all = recFor(k), left = all.filter(function(x){ return !recDone(x,k); }).length;
  if(k===TODAY && all.length > 1 && left===0){
    burst(pt[0], pt[1], 18); toast(ph("allRhythms","Ритм дня собран ✦")); haptic("success");
  } else burst(pt[0], pt[1], 6);
}

/* ================= Boot ================= */
var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

function boot(){
  document.getElementById("app").innerHTML = '<div class="loading">Настраиваю твой ритм…</div>';
  fetch("data.json?v=" + Date.now(), {cache:"no-store"})
    .then(function(r){ if(!r.ok) throw new Error("status " + r.status); return r.json(); })
    .then(function(json){ DATA = json; return init(); })
    .catch(function(){
      /* В Telegram без data.json показываем заглушку.
         При открытии файла на компьютере или в предпросмотре берём встроенную копию данных. */
      var fb = null;
      try { fb = JSON.parse(document.getElementById("fallback-data").textContent); } catch(e){}
      if(inTelegram() || !fb){ showStub(); return; }
      DATA = fb;
      init().then(function(){ toast("Открыто без data.json: показаны встроенные данные"); });
    });
}

function showStub(){
  document.getElementById("dock").hidden = true;
  document.getElementById("app").innerHTML =
    '<div class="stub"><div class="moon">🌙</div><h2>Данные не загрузились</h2>' +
    '<p>Проверь, что файл data.json лежит в той же папке, что и index.html, и есть интернет.</p>' +
    '<button class="btn" id="retry">Загрузить снова</button></div>';
  document.getElementById("retry").onclick = boot;
}

function init(){
  return store.getMany(["tasks","rec","joy","thread"]).then(function(v){
    var fresh = !v.tasks;
    try { TASKS = v.tasks ? JSON.parse(v.tasks) : null; } catch(e){ TASKS = null; }
    try { REC = v.rec ? JSON.parse(v.rec) : null; } catch(e){ REC = null; }
    try { JOY = v.joy ? JSON.parse(v.joy) : []; } catch(e){ JOY = []; }
    try { THREAD = v.thread ? JSON.parse(v.thread) : {n:0,last:""}; } catch(e){ THREAD = {n:0,last:""}; }
    if(!TASKS){
      TASKS = (DATA.tasks||[]).map(function(t){
        return {id:t.id, title:t.title, sphere:t.sphere, date:dkey(addDays(new Date(), t.dayOffset||0)), imp:!!t.important, doneOn:null};
      });
      saveTasks();
    }
    if(!REC){ REC = (DATA.recurring||[]).map(function(r){ return {id:r.id,title:r.title,sphere:r.sphere,days:r.days.slice()}; }); saveRec(); }
    var edge = dkey(addDays(new Date(), -14)), before = TASKS.length;
    TASKS = TASKS.filter(function(t){ return !(t.doneOn && t.doneOn < edge); });
    if(TASKS.length !== before) saveTasks();

    return loadDays(weekKeys(0).concat(weekKeys(-1), [TODAY])).then(function(){
      if(fresh && DATA.app && DATA.app.demo) seedDemo();
      document.getElementById("dock").hidden = false;
      render();
    });
  });
}

/* Демо-история прошедших дней недели, чтобы прототип выглядел живым */
function seedDemo(){
  var keys = weekKeys(0), states = DATA.states.map(function(s){ return s.id; });
  var notes = ["нашла время на себя","не бросила тренировку, хотя очень хотелось","записала подкаст на одном дыхании","просто была в моменте с близкими","закончила то, что давно откладывала","позволила себе отдохнуть без чувства вины"];
  var seeded = 0;
  keys.forEach(function(k, i){
    if(k >= TODAY) return;
    var d = day(k);
    if(d.m) return;
    d.m = 1; d.e = 1; d.pr = i % 2 ? 1 : 0;
    d.st = states[i % states.length];
    d.est = states[(i+2) % states.length];
    recFor(k).forEach(function(r, j){ if((i + j) % 4 !== 3) d.done[r.id] = r.sphere; });
    d.done["demo"+i] = i % 2 ? "projects" : "content";
    d.note = notes[i % notes.length];
    JOY.unshift({d:k, t:d.note, s:d.est});
    saveDay(k); seeded++;
  });
  if(seeded){ THREAD = {n:seeded + 12, last:dkey(addDays(new Date(),-1))}; saveThread(); saveJoy(); }
}

/* ================= Render ================= */
function render(){
  applyTheme();
  document.querySelectorAll(".tab").forEach(function(b){ b.classList.toggle("active", b.dataset.tab===ui.tab); });
  if(ui.tab==="day") renderDay();
  else if(ui.tab==="week") renderWeek();
  else renderRhythm();
}

function greeting(){
  var h = new Date().getHours();
  if(h>=5 && h<12) return "Доброе утро";
  if(h>=12 && h<18) return "Добрый день";
  if(h>=18 && h<23) return "Добрый вечер";
  return "Доброй ночи";
}

function taskCard(t){
  var s = sphere(t.sphere);
  return '<div class="card'+(t.doneOn?' done':'')+'">' +
    '<div class="sph" style="background:'+tint(s.color)+'">'+s.icon+'</div>' +
    '<div class="txt"><div class="t">'+esc(t.title)+'</div><div class="s">'+esc(s.name)+'</div></div>' +
    '<button class="check" data-task="'+t.id+'" aria-label="Отметить">'+CHECK+'</button></div>';
}
function taskRow(t, extra){
  var s = sphere(t.sphere);
  var sub = esc(s.name) + (t.date<TODAY && !t.doneOn ? ', с '+shortDate(t.date) : '');
  return '<div class="row'+(t.doneOn?' done':'')+'"><span class="dot" style="background:'+s.color+'"></span>' +
    '<div class="txt"><div class="t">'+esc(t.title)+'</div><div class="s">'+sub+'</div></div>' + (extra||'') +
    '<button class="check'+(t.doneOn?' on':'')+'" data-task="'+t.id+'" aria-label="Отметить">'+CHECK+'</button></div>';
}
function recChip(r, k, disabled){
  var s = sphere(r.sphere), on = recDone(r,k);
  return '<button class="chip'+(on?' on':'')+'" data-rec="'+r.id+'" data-day="'+k+'"'+(disabled?' disabled':'')+'>' +
    '<span class="ic">'+(on?'✓':s.icon)+'</span>'+esc(r.title)+'</button>';
}

function renderDay(){
  var d = day(TODAY);
  var st = stateById(d.st);
  var rec = recFor(TODAY);
  var over = overdue();
  var todays = tasksFor(TODAY);
  var focus = d.f ? taskById(d.f) : null;
  var impIds = d.m ? (d.imp||[]) : todays.filter(function(t){ return t.imp; }).map(function(t){ return t.id; });
  var imp = impIds.map(taskById).filter(function(t){ return t && (!focus || t.id!==focus.id); }).slice(0,2);
  var shown = {}; if(focus) shown[focus.id]=1; imp.forEach(function(t){ shown[t.id]=1; });
  var others = over.concat(todays).filter(function(t){ return !shown[t.id]; });

  var all = rec.length + (focus?1:0) + imp.length + others.length;
  var done = rec.filter(function(r){ return recDone(r,TODAY); }).length +
    [focus].concat(imp, others).filter(function(t){ return t && t.doneOn; }).length;
  var ratio = all ? done/all : 0;
  var phrase = ratio>=.75 ? ph("progressHigh","") : ratio>=.35 ? ph("progressMid","") : ph("progressLow","");
  var C = 2*Math.PI*26;
  var eveningFrom = (DATA.app && DATA.app.eveningFrom) || 19;
  var isEvening = new Date().getHours() >= eveningFrom;
  var threadN = (THREAD.n||0);

  var h = '';
  h += '<section class="hero"><div class="portrait"><div class="orbit"><i class="o1"></i><i class="o2"></i><i class="o3"></i><i class="spark">✦</i></div>' +
       '<img src="'+PHOTO+'" alt="Татьяна">' + (st ? '<div class="state-badge" title="'+esc(st.name)+'">'+st.icon+'</div>' : '') + '</div>' +
       '<h1 class="greet">'+greeting()+',<br>'+esc(DATA.app.ownerName||"")+'</h1>' +
       '<p class="date">'+human(TODAY)+'</p>' +
       (threadN ? '<p class="thread-line">'+threadN+' '+plural(threadN,"день","дня","дней")+' в ритме</p><br>' : '') +
       (st ? '<button class="state-chip" id="chState">Сегодня я выбираю <b>'+st.icon+' '+esc(st.name)+'</b></button>' : '') +
       '</section>';

  if(!d.m){
    h += '<section class="invite"><h3>'+esc(ph("morning","Каким ты хочешь прожить этот день?"))+'</h3>' +
         '<p>Три коротких шага: состояние, главный фокус и два важных дела.</p>' +
         '<button class="btn plum" id="startDay">Начать день</button></section>';
  } else {
    if(st){
      var phrase1 = pickDaily(st.phrases, TODAY, 0);
      var pr = pickDaily(st.practices, TODAY, 1);
      if(phrase1 || pr){
        h += '<section class="mood">' + (phrase1 ? '<q>'+esc(phrase1)+'</q>' : '') +
             (pr ? '<button class="mood-act'+(d.pr?' done':'')+'" id="practice"><span class="pl">'+(d.pr?'✓':'▶')+'</span>' +
                   (d.pr ? 'Практика сделана' : esc(pr.title)+', 1 минута') + '</button>' : '') + '</section>';
      }
    }
    if(focus){
      var fs = sphere(focus.sphere);
      h += '<section class="focus'+(focus.doneOn?' done':'')+'"><div class="focus-label">Главный фокус дня</div>' +
           '<div class="focus-title">'+esc(focus.title)+'</div>' +
           '<div class="focus-row"><span class="focus-sphere">'+fs.icon+' '+esc(fs.name)+'</span>' +
           '<button class="focus-check" data-task="'+focus.id+'">'+(focus.doneOn?'Сделано ✓':'Отметить')+'</button></div></section>';
    } else {
      h += '<section class="invite"><h3>Фокус дня не выбран</h3><p>Выбери одно дело, которое сегодня важнее всего.</p>' +
           '<button class="btn plum" id="startDay">Выбрать фокус</button></section>';
    }
  }

  if(imp.length){
    h += '<section class="block"><div class="block-head"><h2>Важное сегодня</h2></div>' + imp.map(taskCard).join('') + '</section>';
  }

  if(rec.length){
    var rd = rec.filter(function(r){ return recDone(r,TODAY); }).length;
    h += '<section class="block"><div class="block-head"><h2>Мои ритмы</h2><span>'+rd+' из '+rec.length+'</span></div>' +
         '<div class="chips">' + rec.map(function(r){ return recChip(r, TODAY); }).join('') + '</div></section>';
  }

  if(others.length){
    h += '<section class="block"><button class="more-toggle'+(ui.moreOpen?' open':'')+'" id="moreT">' +
         '<span>Ещё на сегодня: '+others.length+'</span><span class="arr">⌄</span></button>' +
         (ui.moreOpen ? '<div class="panel more-list">'+others.map(function(t){ return taskRow(t); }).join('')+'</div>' : '') + '</section>';
  }

  h += '<section class="block"><div class="progress">' +
       '<svg class="ring" viewBox="0 0 64 64"><circle class="bgc" cx="32" cy="32" r="26"/>' +
       '<circle class="fg" cx="32" cy="32" r="26" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+(C*(1-ratio)).toFixed(1)+'" transform="rotate(-90 32 32)"/>' +
       '<text x="32" y="38" text-anchor="middle">'+done+'</text></svg>' +
       '<div><div class="p1">'+esc(all ? phrase : "Сегодня свободный день")+'</div><div class="p2">'+done+' из '+all+' дел на сегодня</div></div></div></section>';

  if(d.e){
    var est = stateById(d.est);
    h += '<section class="block"><div class="evening-note"><div class="q">Сегодня я довольна тем, что</div>' +
         '<div class="a">'+esc(d.note||"прожила этот день")+'</div>' +
         (est ? '<div class="q" style="margin-top:10px">Каким был день: '+est.icon+' '+esc(est.name)+'</div>' : '') + '</div></section>';
  } else {
    h += '<section class="block"><button class="btn '+(isEvening?'':'ghost')+'" id="endDay">🌙 Завершить день</button></section>';
  }

  document.getElementById("app").innerHTML = '<main>'+h+'</main>';

  bindCommon();
  var s1 = document.getElementById("startDay"); if(s1) s1.onclick = function(){ morningFlow(d.m ? 2 : 1); };
  var s2 = document.getElementById("chState"); if(s2) s2.onclick = function(){ morningFlow(1, true); };
  var s3 = document.getElementById("moreT"); if(s3) s3.onclick = function(){ ui.moreOpen = !ui.moreOpen; render(); };
  var s4 = document.getElementById("endDay"); if(s4) s4.onclick = eveningFlow;
  var s5 = document.getElementById("practice"); if(s5) s5.onclick = function(){ practiceFlow(st); };
}

function bindCommon(){
  document.querySelectorAll("[data-task]").forEach(function(b){
    b.onclick = function(){ var t = taskById(b.dataset.task); if(t) toggleTask(t, b); };
  });
  document.querySelectorAll("[data-rec]").forEach(function(b){
    b.onclick = function(){
      if(b.disabled) return;
      var r = REC.filter(function(x){ return x.id===b.dataset.rec; })[0];
      if(r) toggleRec(r, b.dataset.day, b);
    };
  });
  document.querySelectorAll("[data-move]").forEach(function(b){
    b.onclick = function(){ var t = taskById(b.dataset.move); if(t) moveFlow(t); };
  });
}

/* ---------- Week ---------- */
function renderWeek(){
  var keys = weekKeys(ui.weekOffset);
  if(keys.indexOf(ui.sel) < 0) ui.sel = keys.indexOf(TODAY) > -1 ? TODAY : keys[0];
  loadDays(keys).then(function(){
    var first = fromKey(keys[0]), last = fromKey(keys[6]);
    var range = first.getMonth()===last.getMonth()
      ? first.getDate()+"–"+last.getDate()+" "+MONTHS[last.getMonth()]
      : shortDate(keys[0])+" – "+shortDate(keys[6]);

    var h = '<h1 class="page-title">Моя неделя</h1>' +
      '<div class="page-sub"><span>'+range+'</span><span class="wk-nav"><button id="wPrev" aria-label="Прошлая неделя">‹</button><button id="wNext" aria-label="Следующая неделя">›</button></span></div>';

    h += '<div class="days">' + keys.map(function(k, i){
      var spheres = {};
      recFor(k).forEach(function(r){ spheres[r.sphere]=1; });
      tasksFor(k).forEach(function(t){ spheres[t.sphere]=1; });

/* ---------- Rhythm ---------- */
function weekSummary(keys){
  var per = keys.map(function(k){ return DAYS[k] && DAYS[k].done ? Object.keys(DAYS[k].done).length : 0; });
  var stats = (DATA.stats||[]).map(function(s){
    var dots = [], got = 0, plan = 0;
    if(s.type==="recurring"){
      var r = REC.filter(function(x){ return x.id===s.ref; })[0];
      keys.forEach(function(k){
        var planned = r && r.days.indexOf(isoDow(fromKey(k)))>-1;
        var ok = !!(DAYS[k] && DAYS[k].done && DAYS[k].done[s.ref]);
        if(planned) plan++; if(ok) got++;
        dots.push(ok ? 'on' : planned ? 'plan' : '');
      });
      return {s:s, dots:dots, got:got, total:plan, val:got+' из '+plan};
    }
    keys.forEach(function(k){
      var dn = DAYS[k] && DAYS[k].done ? DAYS[k].done : {};
      var ok = Object.keys(dn).some(function(id){ return dn[id]===s.ref; });
      if(ok) got++;
      dots.push(ok ? 'on' : '');
    });
    return {s:s, dots:dots, got:got, total:7, val:got+' из 7'};
  });
  function top(field){
    var c = {}, best = null;
    keys.forEach(function(k){ var v = DAYS[k] && DAYS[k][field]; if(v){ c[v]=(c[v]||0)+1; if(!best || c[v]>c[best]) best=v; } });
    return stateById(best);
  }
  var notes = JOY.filter(function(j){ return keys.indexOf(j.d) > -1; }).slice().reverse();
  return {per:per, total:per.reduce(function(a,b){ return a+b; },0), stats:stats, topMorning:top("st"), topEvening:top("est"), notes:notes};
}

function renderRhythm(){
  var keys = weekKeys(0), prev = weekKeys(-1);
  loadDays(keys.concat(prev)).then(function(){
    var W = weekSummary(keys);
    var max = Math.max.apply(null, W.per.concat([1]));
    var n = THREAD.n || 0;
    var ms = (DATA.milestones||[]).filter(function(x){ return x > n; })[0];

    var h = '<h1 class="page-title">Мой ритм</h1><div class="page-sub"><span>Эта неделя, '+shortDate(keys[0])+' – '+shortDate(keys[6])+'</span></div>';
    h += '<section class="big"><div class="num">'+W.total+'</div><div class="cap">'+plural(W.total,"дело сделано","дела сделано","дел сделано")+' за неделю</div>' +
         '<div class="bars">' + W.per.map(function(v,i){
           var hh = Math.round((v/max)*58);
           return '<div><b class="'+(v?'':'zero')+'" style="height:'+Math.max(hh,4)+'px"></b><span>'+WD[i]+'</span></div>';
         }).join('') + '</div></section>';

    h += '<section class="thread"><div class="knot">'+n+'</div><div><div class="t1">'+plural(n,"день","дня","дней")+' в ритме</div>' +
         '<div class="t2">'+(ms ? 'Следующая отметка: '+ms+'. Пропуски не обнуляют нить' : 'Ты прошла все отметки. Нить продолжается')+'</div></div></section>';

    W.stats.forEach(function(x){
      h += '<div class="stat"><div class="stat-top"><span class="l">'+x.s.icon+' '+esc(x.s.label)+'</span><span class="v">'+x.val+'</span></div>' +
           '<div class="stat-dots">'+x.dots.map(function(c){ return '<i class="'+c+'"></i>'; }).join('')+'</div></div>';
    });

    h += '<div class="sel-head"><h2>Состояния недели</h2><span>утро и вечер</span></div><div class="states-week">' +
      keys.map(function(k,i){
        var d = DAYS[k] || {}, a = stateById(d.st), b = stateById(d.est);
        return '<div><span>'+WD[i]+'</span>'+(a?a.icon:'<em>·</em>')+(b?b.icon:'<em>·</em>')+'</div>';
      }).join('') + '</div>';

    var isSunday = isoDow(new Date()) === 7;
    var prevHas = prev.some(function(k){ return DAYS[k] && (DAYS[k].m || DAYS[k].e || Object.keys(DAYS[k].done||{}).length); });
    h += '<div class="sel-head"><h2>Письмо недели</h2></div><section class="envelope">' +
      (isSunday
        ? '<h3>Твоё письмо готово</h3><p>Неделя позади. Посмотри, какой она была.</p><button class="btn plum" id="letterNow">Открыть письмо</button>'
        : '<h3>Придёт в воскресенье</h3><p>В нём будет твоя неделя: что получилось, какие были состояния и чем ты была довольна.</p>' +
          '<button class="btn ghost" id="letterNow">Заглянуть в черновик</button>') +
      (prevHas ? '<button class="link" id="letterPrev">Письмо прошлой недели</button>' : '') + '</section>';

    h += '<div class="sel-head"><h2>Копилка радости</h2><span>'+JOY.length+'</span></div>';
    h += JOY.length ? '<div class="joy">' + JOY.slice(0,12).map(function(j){
      var s = stateById(j.s);
      return '<div class="joy-item"><div class="jt">'+esc(j.t)+'</div><div class="jd">'+shortDate(j.d)+(s?', '+s.icon+' '+esc(s.name):'')+'</div></div>';
    }).join('') + '</div>'
    : '<div class="panel"><div class="empty">Здесь будут собираться твои вечерние «довольна тем, что…». Их можно перечитать в трудный день.</div></div>';

    h += '<p class="quiet">Здесь нет долгов.<br>Только твой ритм.</p>';

    document.getElementById("app").innerHTML = '<main>'+h+'</main>';
    document.getElementById("letterNow").onclick = function(){ letterFlow(keys, !isSunday); };
    var lp = document.getElementById("letterPrev"); if(lp) lp.onclick = function(){ letterFlow(prev, false); };
  });
}

/* ---------- Morning ---------- */

      statesGrid(m.st) + '<button class="btn plum" id="n1"'+(m.st?'':' disabled')+'>'+(onlyState?'Сохранить':'Дальше')+'</button>');
    sheet.querySelectorAll("[data-st]").forEach(function(b){

        document.getElementById("n1").disabled = false;
        /* приложение сразу окрашивается в цвет выбранного состояния */

      };
    });

    };
  }
  function step2(){
    var list = candidates();
    openSheet(stepsDots(2,3) + '<h3>Что сегодня главное?</h3><p class="hint">Одно дело, которое хочется сделать обязательно</p>' +
      list.map(function(t){ return '<button class="pick'+(m.f===t.id?' on':'')+'" data-p="'+t.id+'"><span class="t">'+esc(t.title)+'</span><span class="r"></span></button>'; }).join('') +
      '<div class="lbl">Или впиши своё</div><input class="field" id="newF" placeholder="Например: дописать программу ретрита" maxlength="80">' +
      '<div id="newFs" hidden><div class="lbl">Сфера</div>' + sphereSeg(m.newSphere, "small") + '</div>' +
      '<button class="btn plum" id="n2">Дальше</button>');
    sheet.querySelectorAll("[data-p]").forEach(function(b){
      b.onclick = function(){
        m.f = b.dataset.p;
        sheet.querySelectorAll("[data-p]").forEach(function(x){ x.classList.toggle("on", x===b); });
        document.getElementById("newF").value = ""; document.getElementById("newFs").hidden = true;
      };
    });
    var inp = document.getElementById("newF");
    inp.oninput = function(){
      var has = !!inp.value.trim();
      document.getElementById("newFs").hidden = !has;
      if(has){ m.f = null; sheet.querySelectorAll("[data-p]").forEach(function(x){ x.classList.remove("on"); }); }
    };
    bindSphereSeg(function(id){ m.newSphere = id; });
    document.getElementById("n2").onclick = function(){
      var v = inp.value.trim();
      if(v){ var t = {id:uid("t"), title:v, sphere:m.newSphere, date:TODAY, imp:true, doneOn:null}; TASKS.push(t); saveTasks(); m.f = t.id; }
      if(!m.f){ toast("Выбери или впиши одно дело"); return; }
      m.imp = m.imp.filter(function(id){ return id!==m.f; });
      step3();
    };
  }
  function step3(){
    var list = candidates().filter(function(t){ return t.id!==m.f; });
    openSheet(stepsDots(3,3) + '<h3>Ещё два важных</h3><p class="hint" id="impHint">Можно пропустить. Выбрано: '+m.imp.length+' из 2</p>' +
      (list.length ? list.map(function(t){ return '<button class="pick'+(m.imp.indexOf(t.id)>-1?' on':'')+'" data-p="'+t.id+'"><span class="t">'+esc(t.title)+'</span><span class="r"></span></button>'; }).join('')
                   : '<div class="empty">Других дел на сегодня нет</div>') +
      '<button class="btn" id="n3">Начать день</button>');
    sheet.querySelectorAll("[data-p]").forEach(function(b){
      b.onclick = function(){
        var id = b.dataset.p, i = m.imp.indexOf(id);
        if(i>-1) m.imp.splice(i,1); else if(m.imp.length<2) m.imp.push(id); else { toast("Не больше двух: так легче"); return; }

      };
    });
    document.getElementById("n3").onclick = function(){
      d.st = m.st; d.f = m.f; d.imp = m.imp; d.m = 1; saveDay(TODAY);
      closeSheet(); haptic("success"); render(); markThread();
      toast("Хорошего дня ✦");
    };
  }
  if(startStep===2 && m.st) step2(); else step1();
}

/* ---------- Practice (breathing) ---------- */
function practiceFlow(st){
  var pr = st && pickDaily(st.practices, TODAY, 1);
  if(!pr) return;
  var inh = pr.inhale || 4, exh = pr.exhale || 6, total = 60;
  openSheet('<h3>'+esc(pr.title)+'</h3><p class="hint">Одна минута для себя</p>' +
    '<div class="breath"><div class="halo" id="halo"></div><div class="core" id="core">Готова?<small>1 минута</small></div></div>' +
    '<p class="practice-text">'+esc(pr.text)+'</p><button class="btn plum" id="prGo">Начать</button>');
  var timer = null, left = total, phase = "", phaseLeft = 0;
  var halo = document.getElementById("halo"), core = document.getElementById("core"), btn = document.getElementById("prGo");
  function setPhase(p){
    phase = p; phaseLeft = p==="in" ? inh : exh;
    halo.style.transitionDuration = phaseLeft + "s";
    halo.style.transform = p==="in" ? "scale(1)" : "scale(.62)";
  }
  function paint(){ core.innerHTML = (phase==="in" ? "Вдох" : "Выдох") + "<small>" + left + " сек</small>"; }
  function finish(){
    clearInterval(timer); timer = null;
    var d = day(TODAY); d.pr = 1; saveDay(TODAY);
    core.innerHTML = "Спасибо<small>практика сделана</small>";
    halo.style.transitionDuration = "1.2s"; halo.style.transform = "scale(.8)";
    btn.textContent = "Вернуться в день"; btn.onclick = function(){ closeSheet(); render(); };
    var p = centerOf(core); burst(p[0], p[1], 16); haptic("success");
  }
  btn.onclick = function(){
    if(timer) return;
    btn.textContent = "Закончить раньше";
    btn.classList.remove("plum"); btn.classList.add("ghost");
    btn.onclick = finish;
    setPhase("in"); paint();
    timer = setInterval(function(){
      left--; phaseLeft--;
      if(left <= 0){ finish(); return; }
      if(phaseLeft <= 0){ setPhase(phase==="in" ? "out" : "in"); haptic(); }
      paint();
    }, 1000);
  };
  sheetCleanup = function(){ if(timer){ clearInterval(timer); timer = null; } };
}

    });

      '<button class="btn" id="e4">Завершить день</button>');

    h += '<p>'+(draft ? 'Пока неделя в пути, но ты уже сделала ' : 'На этой неделе ты сделала ')+W.total+' '+plural(W.total,"дело","дела","дел")+'.</p>';
    var parts = W.stats.map(function(x){ return esc(x.s.label.toLowerCase())+': '+x.val; });
    if(parts.length) h += '<p>'+parts.join('; ').replace(/^./,function(c){return c.toUpperCase();})+'.</p>';
    if(W.topMorning) h += '<p>Чаще всего утром ты выбирала '+W.topMorning.icon+' '+esc(W.topMorning.name.toLowerCase())+
      (W.topEvening ? ', а вечером дни чаще были про '+W.topEvening.icon+' '+esc(W.topEvening.name.toLowerCase()) : '')+'.</p>';
    if(W.notes.length){
      h += '<p>Ты была довольна тем, что:</p><ul>' + W.notes.map(function(j){ return '<li>'+esc(j.t)+'</li>'; }).join('') + '</ul>';
    }
    h += '<p>'+esc(ph("letterClosing","Ты была с собой — и это главное."))+'</p>';
    h += '<p class="sign">'+esc(ph("letterSign","Твой ритм ✦"))+'</p>';
    openSheet('<h3>'+(draft ? 'Черновик письма' : 'Письмо недели')+'</h3><p class="hint">'+shortDate(keys[0])+' – '+shortDate(keys[6])+'</p>' +
      '<div class="letter">'+h+'</div><button class="btn plum" id="lClose">Спасибо</button>');
    document.getElementById("lClose").onclick = closeSheet;
    if(!draft){ var p = centerOf(sheet.querySelector(".letter")); setTimeout(function(){ burst(p[0], window.innerHeight*0.3, 16); }, 350); }
  });
}

/* ---------- Move ---------- */
function moveFlow(t){
  var chips = '';
  for(var i=0;i<=7;i++){
    var k = dkey(addDays(new Date(), i));
    if(k===t.date) continue;
    chips += '<button data-to="'+k+'">'+(i===0?'Сегодня':i===1?'Завтра':WD[isoDow(fromKey(k))-1]+', '+fromKey(k).getDate())+'</button>';
  }
  openSheet('<h3>Перенести дело</h3><p class="hint">'+esc(t.title)+'</p><div class="seg">'+chips+'</div>' +
    '<button class="btn ghost" id="rel">Отпустить это дело</button>');
  sheet.querySelectorAll("[data-to]").forEach(function(b){
    b.onclick = function(){ t.date = b.dataset.to; saveTasks(); closeSheet(); toast("Перенесено: "+shortDate(t.date)); render(); };
  });
  document.getElementById("rel").onclick = function(){ TASKS = TASKS.filter(function(x){ return x.id!==t.id; }); saveTasks(); closeSheet(); toast("Отпущено"); render(); };
}

/* ---------- Add ---------- */
function addFlow(presetDate){
  var a = { title:"", sphere:DATA.spheres[0].id, when: presetDate && presetDate!==TODAY ? (presetDate===TOMORROW?"tom":"date") : "today",
            date: presetDate || TODAY, days:[], imp:false };
  var whenBtns = [["today","Сегодня"],["tom","Завтра"],["date","Выбрать день"],["repeat","Повторять"]].map(function(w){
    return '<button data-w="'+w[0]+'" class="'+(a.when===w[0]?'on':'')+'">'+w[1]+'</button>';
  }).join('');
  openSheet('<h3>Новое дело</h3><p class="hint">Коротко и понятно: так легче начать</p>' +
    '<input class="field" id="aT" placeholder="Что сделать?" maxlength="80">' +
    '<div class="lbl">Сфера</div>' + sphereSeg(a.sphere) +
    '<div class="lbl">Когда</div><div class="seg" id="aWhen">'+whenBtns+'</div>' +
    '<div id="aExtra"></div>' +
    '<button class="btn plum" id="aOk">Добавить</button>');

  /* Меняется только нижняя часть формы: поле с текстом и клавиатура остаются на месте */
  function drawExtra(){
    var x = '';
    if(a.when==="date") x += '<input class="field" type="date" id="aD" value="'+a.date+'" min="'+TODAY+'">';
    if(a.when==="repeat") x += '<div class="wds">' + WD.map(function(w,i){ return '<button data-wd="'+(i+1)+'" class="'+(a.days.indexOf(i+1)>-1?'on':'')+'">'+w+'</button>'; }).join('') + '</div>';
    else x += '<div class="toggle-row"><span>⭐ Важное дело</span><button class="sw'+(a.imp?' on':'')+'" id="aI" aria-label="Важное"></button></div>';
    var box = document.getElementById("aExtra"); box.innerHTML = x;
    var dd = document.getElementById("aD"); if(dd) dd.onchange = function(){ a.date = dd.value; };
    var ii = document.getElementById("aI"); if(ii) ii.onclick = function(){ a.imp = !a.imp; ii.classList.toggle("on", a.imp); };
    box.querySelectorAll("[data-wd]").forEach(function(b){
      b.onclick = function(){ var n=+b.dataset.wd, i=a.days.indexOf(n); if(i>-1) a.days.splice(i,1); else a.days.push(n); b.classList.toggle("on", a.days.indexOf(n)>-1); };
    });
  }
  bindSphereSeg(function(id){ a.sphere = id; });
  sheet.querySelectorAll("[data-w]").forEach(function(b){
    b.onclick = function(){
      a.when = b.dataset.w;
      sheet.querySelectorAll("[data-w]").forEach(function(x){ x.classList.toggle("on", x===b); });
      drawExtra();
    };
  });
  drawExtra();

  document.getElementById("aOk").onclick = function(){
    var title = document.getElementById("aT").value.trim();
    if(!title){ toast("Напиши, что сделать"); return; }
    if(a.when==="repeat"){
      if(!a.days.length){ toast("Выбери дни недели"); return; }
      REC.push({id:uid("r"), title:title, sphere:a.sphere, days:a.days.slice().sort()}); saveRec();
      toast("Добавлено в ритмы");
    } else {
      var k = a.when==="today" ? TODAY : a.when==="tom" ? TOMORROW : (a.date || TODAY);
      var t = {id:uid("t"), title:title, sphere:a.sphere, date:k, imp:a.imp, doneOn:null};
      TASKS.push(t); saveTasks();
      if(a.imp && k===TODAY){ var d = day(TODAY); if(d.m){ d.imp = d.imp||[]; if(d.imp.length<2){ d.imp.push(t.id); saveDay(TODAY); } } }
      toast(k===TODAY ? "Добавлено на сегодня" : "Добавлено: "+shortDate(k));
    }
    haptic(); closeSheet(); render();
  };
}

/* ================= Navigation ================= */
document.querySelectorAll(".tab").forEach(function(b){
  b.onclick = function(){ ui.tab = b.dataset.tab; if(ui.tab==="week"){ ui.weekOffset = 0; ui.sel = TODAY; } window.scrollTo(0,0); render(); };
});
document.getElementById("fab").onclick = function(){ addFlow(ui.tab==="week" ? ui.sel : TODAY); };

loadTelegramSDK(function(){ setupTelegram(); boot(); });
})();
</script>
